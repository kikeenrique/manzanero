name: Beta release
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # Same toolchain as CI: Xcode 27.2 exists only on the preview `xcode-27`
    # image, whose default Xcode is 27.1.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Record toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          fingerprint=$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "key=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v4
      - name: Install build output formatter
        run: brew install xcsift
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: tmp/swift-cache
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-dependencies-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-dependencies-
      - name: Cache debug builds
        uses: actions/cache@v6
        with:
          path: |
            .build
            tmp/clang-cache
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-debug-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-debug-
      - name: Cache release builds
        uses: actions/cache@v6
        with:
          path: tmp/release-build
          key: swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-release-
      - name: Check version against tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^let manzaneroVersion = "\(.*\)"$/\1/p' Sources/Manzanero/Version.swift)
          test "$RELEASE_TAG" = "v$version"
      - run: mise tasks validate
      - run: mise run test
      - run: mise run package
      - run: mise run test:package
      - name: Generate tap formula
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: mise run release:formula "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: beta-dist
          path: tmp/dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: beta-dist
          path: dist
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          directory="dist/${RELEASE_TAG#v}"
          cd "$directory"
          sha256sum --strict -c SHA256SUMS
          # Refuse replacement of an existing release: tap checksums must remain stable.
          gh release create "$RELEASE_TAG" manzanero-*-apple-darwin.tar.gz SHA256SUMS manzanero.rb \
            --repo "$RELEASE_REPOSITORY" --verify-tag --draft --prerelease --generate-notes --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --prerelease
