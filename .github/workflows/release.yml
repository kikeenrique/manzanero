name: Beta release
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: jdx/mise-action@v4
      - name: Install build output formatter
        run: brew install xcsift
      - name: Check version against tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^let manzaneroVersion = "\(.*\)"$/\1/p' Sources/Manzanero/Version.swift)
          test "$RELEASE_TAG" = "v$version"
      - run: mise run test
      - run: mise run package
      - run: mise run test:package
      - name: Generate tap formula
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: mise run release:formula "$RELEASE_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: beta-dist
          path: tmp/dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: beta-dist
          path: dist
      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          directory="dist/${RELEASE_TAG#v}"
          cd "$directory"
          sha256sum --strict -c SHA256SUMS
          # Refuse replacement of an existing release: tap checksums must remain stable.
          gh release create "$RELEASE_TAG" manzanero-*-apple-darwin.tar.gz SHA256SUMS manzanero.rb \
            --repo "$RELEASE_REPOSITORY" --verify-tag --draft --prerelease --generate-notes --title "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --draft=false --prerelease
