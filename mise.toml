[task_config]
includes = ["mise/tasks"]

[tools]
# Build-output formatter used by every Swift task and by CI; pinned so a new
# release cannot change parsing or summaries without a repository change.
xcsift = "1.7.5"

[env]
# Optional, untracked machine-local values (DEVELOPER_DIR, DEVELOPMENT_TEAM); see docs/development-tasks.md.
_.file = ".env.local"
CLANG_MODULE_CACHE_PATH = "{{ config_root }}/tmp/clang-cache"

[task_templates.swift]
dir = "{{ config_root }}"
shell = "bash -e -o pipefail -c"
