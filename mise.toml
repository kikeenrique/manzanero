[vars]
rust_version = "1.99.1"

[task_templates.swift]
dir = "{{ config_root }}"
env = { CLANG_MODULE_CACHE_PATH = "{{ config_root }}/tmp/clang-cache" }
shell = "bash -e -o pipefail -c"

[tasks.build]
extends = "swift"
description = "Build the Swift CLI through xcsift"
run = "swift build --cache-path tmp/swift-cache 2>&1 | xcsift -f toon"

[tasks.test]
extends = "swift"
description = "Run Swift tests through xcsift"
run = "swift test --cache-path tmp/swift-cache 2>&1 | xcsift -f toon"

[tasks.cli]
dir = "{{ config_root }}"
description = "Run the built Swift CLI with the local physical bridge on PATH"
env = { PATH = "{{ config_root }}/tmp/bin:{{ env.PATH }}" }
run = ".build/debug/appledevicescmd"

[tasks."coredevice:setup"]
dir = "{{ config_root }}"
description = "Fetch the pinned MIT-licensed ipb helper sources under tmp"
shell = "bash -e -o pipefail -c"
run = '''
if [ ! -e tmp/ipb ]; then
  git clone --no-checkout --depth 1 https://github.com/ipbtools/ipb.git tmp/ipb
  git -C tmp/ipb fetch --depth 1 origin 8c227a10710dad479852aa0203de729fed57471b
  git -C tmp/ipb checkout --detach 8c227a10710dad479852aa0203de729fed57471b
fi
test "$(git -C tmp/ipb rev-parse HEAD)" = 8c227a10710dad479852aa0203de729fed57471b
git -C tmp/ipb diff --exit-code HEAD
'''

[tasks."coredevice:build"]
extends = "swift"
description = "Build the pinned native CoreDevice helper into tmp/bin"
depends = ["coredevice:setup"]
run = '''
mkdir -p tmp/coredevice-source/Sources
cp tmp/ipb/Sources/* tmp/coredevice-source/Sources/
cp Backends/CoreDevice/multitouch.inc tmp/coredevice-source/Sources/
cat tmp/ipb/Sources/universalhid_glue.swift Backends/CoreDevice/raw-report.swift > tmp/coredevice-source/Sources/universalhid_glue.swift
git apply --directory=tmp/coredevice-source Backends/CoreDevice/multitouch.patch
make -C tmp/ipb SOURCES_DIR=../coredevice-source/Sources BUILD_DIR=../coredevice-build check-reports ../coredevice-build/ipb-helper 2>&1 | xcsift -f toon
test -x tmp/coredevice-build/ipb-helper
mkdir -p tmp/bin
cp tmp/coredevice-build/ipb-helper tmp/bin/appledevices-coredevice
'''

[tasks."test:mcp-live"]
extends = "swift"
description = "Verify MCP stdio tools against a selected booted simulator"
depends = ["build"]
usage = 'arg "<simulator>" help="Explicit booted simulator UUID"'
run = 'APPLEDEVICES_MCP_LIVE=1 APPLEDEVICES_MCP_TEST_SIMULATOR="$usage_simulator" swift test --cache-path tmp/swift-cache --filter MCPStdioTests 2>&1 | xcsift -f toon'

[tasks."coredevice:test"]
dir = "{{ config_root }}"
description = "Test native multitouch scheduling, validation, and failure cleanup without a device"
run = ["mkdir -p tmp/coredevice-tests", "clang -Wall -Wextra -Werror Backends/CoreDevice/test-multitouch.c -o tmp/coredevice-tests/multitouch", "tmp/coredevice-tests/multitouch"]

[tasks."test:mcp-physical"]
extends = "swift"
description = "Verify MCP stdio physical AX tree for an explicitly selected device and PID"
depends = ["build"]
env = { PATH = "{{ config_root }}/tmp/bin:{{ env.PATH }}" }
usage = '''
arg "<device>" help="Explicit physical device UDID"
arg "<pid>" help="Current application PID to inspect; may be a background app"
'''
run = 'APPLEDEVICES_MCP_LIVE=1 APPLEDEVICES_MCP_TEST_PHYSICAL="$usage_device" APPLEDEVICES_MCP_TEST_PID="$usage_pid" swift test --cache-path tmp/swift-cache --filter MCPStdioTests 2>&1 | xcsift -f toon'

[task_templates.idevice]
dir = "{{ config_root }}"
env = { MISE_DATA_DIR = "{{ config_root }}/tmp/mise-data", MISE_CACHE_DIR = "{{ config_root }}/tmp/mise-cache", CARGO_HOME = "{{ config_root }}/tmp/cargo-home", RUSTUP_HOME = "{{ config_root }}/tmp/rustup" }

[tasks."idevice:setup"]
extends = "idevice"
description = "Install the pinned Rust toolchain under tmp"
run = "mise install rust@{{ vars.rust_version }}"

[tasks."idevice:build"]
extends = "idevice"
description = "Build the locked idevice bridge into tmp/bin"
depends = ["idevice:setup"]
usage = '''
flag "--debug" help="Build without release optimization"
flag "--offline" help="Use cached Cargo dependencies only"
'''
shell = "bash -e -o pipefail -c"
run = '''
bridge_profile=release
bridge_args=(build --release --locked --manifest-path Backends/IDevice/Cargo.toml --target-dir tmp/idevice-build)
if [ "${usage_debug:-false}" = true ]; then
  bridge_profile=debug
  bridge_args=(build --locked --manifest-path Backends/IDevice/Cargo.toml --target-dir tmp/idevice-build)
fi
if [ "${usage_offline:-false}" = true ]; then bridge_args+=(--offline); fi
mise exec rust@{{ vars.rust_version }} -- cargo "${bridge_args[@]}"
mkdir -p tmp/bin
cp "tmp/idevice-build/$bridge_profile/appledevices-idevice" tmp/bin/appledevices-idevice
'''

[tasks."idevice:test"]
extends = "idevice"
description = "Test the locked idevice bridge"
depends = ["idevice:setup"]
usage = 'flag "--offline" help="Use cached Cargo dependencies only"'
shell = "bash -e -o pipefail -c"
run = '''
bridge_args=(test --locked --manifest-path Backends/IDevice/Cargo.toml --target-dir tmp/idevice-build)
if [ "${usage_offline:-false}" = true ]; then bridge_args+=(--offline); fi
mise exec rust@{{ vars.rust_version }} -- cargo "${bridge_args[@]}"
'''

[tasks."idevice:fmt"]
extends = "idevice"
description = "Format the Rust bridge using its pinned toolchain"
depends = ["idevice:setup"]
run = "mise exec rust@{{ vars.rust_version }} -- cargo fmt --manifest-path Backends/IDevice/Cargo.toml"
